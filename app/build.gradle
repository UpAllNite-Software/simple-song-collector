plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        debug {
            def keystoreFile = System.getProperty('os.name').toLowerCase().contains('win')
                    ? 'F:\\DevGit\\upallnitecommon\\Android KeyStores\\SimpleSongCollector.jks'
                    : System.getProperty('user.home') + '/dvl2/upallnitecommon/Android KeyStores/SimpleSongCollector.jks'
            if (new File(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword 'Ssc022121'
                keyAlias 'key0'
                keyPassword 'Ssc022121'
            }
        }
    }

    defaultConfig {
        applicationId "com.open.simplesongfinder"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 34
        compileSdk 34
        versionCode 29
        versionName "1.0.29"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'utf-8'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
    namespace 'com.open.simplesongcollector'

    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xlint:unchecked'
        options.deprecation = true
    }

}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'com.github.UpAllNite-Software:NewPipeExtractor:58ed44bd7ab2271d744eb027c74f0a97e7200079'

    implementation ('org.mozilla:rhino') {
        version {
            strictly '1.7.13'
        }
    }
    implementation 'com.github.ddf:Minim:aed0a1a3e0f472d8ac8d69ea79b51017afe5d796'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "androidx.preference:preference:1.1.1"
    implementation 'androidx.webkit:webkit:1.4.0'
    implementation 'com.android.support:multidex:1.0.3'

    implementation 'com.google.android.material:material:1.3.0'

    implementation ('com.github.TeamNewPipe:nanojson:c7a6c1c08d16b6d5ecded34758e6415e07be2166') {
        exclude group: 'ch.randelshofer', module: 'fastdoubleparser'
    }
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer:2.18.7'

    implementation "io.reactivex.rxjava3:rxjava:3.0.7"
    implementation "io.reactivex.rxjava3:rxandroid:3.0.0"
    implementation 'org.bitbucket.ijabz:jaudiotagger:v3.0.1'
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'


}
repositories {
    mavenCentral()
}